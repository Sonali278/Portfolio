<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#FFFBF5"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sonali Pal Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: stacked rounded "frames", one per section, on a soft paper ground. Tilted cards, paperclips and tape give the scrapbook feel. */
:root{
  --ground:#FFFBF5; --paper:#FFFBF5; --cream:#FAF0E0; --tan:#EBDDC2; --line:#E6D8BF;
  --ink:#1B1A1F; --muted:#5F5A57; --pink:#FFB8D9; --pink-soft:#FFE6F1; --white:#fff;
  --display:"Outfit","Avenir Next","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 30px 60px -28px rgba(60,40,20,.28),0 6px 18px -8px rgba(60,40,20,.12);
  --r-frame:clamp(28px,5vw,56px);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ground);z-index:60}
img,video{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
h1,h2,h3,p{margin:0}
main,.wrap{width:100%;min-width:0;max-width:1200px;margin:0 auto;display:flex;flex-direction:column}
main>*,.wrap>*{min-width:0;max-width:100%}
html{overflow-x:clip}
#detail{gap:clamp(16px,3vw,28px);padding-block:8px 40px}
section[id],footer[id]{scroll-margin-top:84px}

/* top tabs */
.topnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:50;display:flex;justify-content:center;margin-bottom:14px;pointer-events:none}
.navin{pointer-events:auto;display:flex;gap:2px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:99px;padding:5px;box-shadow:0 12px 26px -14px rgba(60,40,20,.45);overflow-x:auto;max-width:100%;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{white-space:nowrap;font-weight:600;font-size:13.5px;padding:10px 15px;border-radius:99px;text-decoration:none;transition:background .25s,transform .25s;min-height:40px;display:inline-flex;align-items:center}
.navin a:hover{background:var(--cream)}
.navin a[aria-current="true"]{background:var(--pink)}

.frame{padding-block:clamp(24px,7vw,6px);position:relative}
.pill{display:inline-flex;align-items:center;gap:7px;background:var(--pink);font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:99px}
.pill svg{width:12px;height:12px;flex:0 0 auto}
.head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:clamp(20px,3vw,34px)}
.head h2{font-weight:800;font-size:clamp(28px,4.6vw,46px);letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
.head p{color:var(--muted);font-size:clamp(15px,1.8vw,18px)}
.mono{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.pre{white-space:pre-line}

.btn{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:15px;padding:15px 24px;border-radius:99px;text-decoration:none;transition:transform .25s,box-shadow .25s,background .25s;min-height:48px}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(60,40,20,.4)}
.btn:active{transform:translateY(0)}
.btn-pink{background:var(--pink)}
.btn-line{border:1.5px solid var(--line);background:transparent}
.btn-line:hover{background:var(--white)}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn-sm{padding:12px 20px;font-size:13px;min-height:44px}

/* placeholders */
.ph{position:absolute;inset:0;display:grid;place-items:center;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 25% 25%,var(--a),transparent 58%),radial-gradient(circle at 75% 70%,var(--b),transparent 60%),var(--c)}
.ph::after{content:"";position:absolute;inset:0;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ph>*{position:relative;z-index:1;text-align:center;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.ph .ico{width:34px;height:34px;border-radius:50%;background:rgba(40,35,35,.5);display:grid;place-items:center;margin:0 auto 6px}
.ph .ico svg{width:16px;height:16px}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.play{position:absolute;left:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--white);display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:transform .25s;z-index:3}
.play:hover{transform:scale(1.1)}
.play svg{width:14px;height:14px;margin-left:2px}

/* hero */
.hero-wrap{padding-top:clamp(8px,2vw,24px)}
.hero{padding:clamp(24px,5vw,64px) 0 clamp(40px,7vw,96px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(24px,5vw,64px);align-items:center}
.hero>div{min-width:0}
.hero h1{font-weight:900;font-size:clamp(60px,11.5vw,148px);line-height:.86;letter-spacing:-.05em;margin-bottom:clamp(20px,3vw,36px)}
.hero h1 span{display:block;overflow-wrap:anywhere}
.hero .bio{color:var(--muted);max-width:30em;font-size:clamp(15px,1.5vw,17px);margin-bottom:28px}
.hero .cta{display:flex;flex-wrap:wrap;gap:12px}
.stage{position:relative;height:clamp(420px,52vw,600px);display:grid;place-items:center}
.phone{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;border-radius:30px;border:5px solid #fff;box-shadow:0 30px 50px -20px rgba(60,40,20,.45);overflow:hidden;background:#cbb89b}
.phone video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:4}
.phone.playing .play,.phone.playing .badge-open{display:none}
.badge-open{position:absolute;top:8%;left:8%;z-index:4;background:var(--pink);font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border-radius:99px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.badge-open i{width:10px;height:10px;border-radius:50%;background:#d6246e;box-shadow:0 0 0 3px #fff6;animation:pulse 1.8s infinite;flex:0 0 auto}
@keyframes pulse{50%{box-shadow:0 0 0 7px #fff0}}
.float{position:absolute;width:clamp(96px,14vw,150px);aspect-ratio:1/1.05;border-radius:20px;border:4px solid #fff;overflow:hidden;box-shadow:0 18px 30px -14px rgba(0,0,0,.4);z-index:3;animation:bob 6s ease-in-out infinite}
.float.f1{left:0;top:24%}
.float.f2{right:0;bottom:10%;animation-delay:-3s}
@keyframes bob{50%{translate:0 -8px}}
.clip{position:absolute;top:-34px;right:12%;width:36px;height:120px;z-index:5;pointer-events:none;filter:drop-shadow(1px 3px 3px rgba(0,0,0,.25))}

/* logos */
.logos-band{background:var(--cream);border:1px solid var(--line);border-radius:26px;box-shadow:0 14px 26px -18px rgba(60,40,20,.35);overflow:hidden;padding:clamp(18px,3vw,30px) 0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.logos-band.editing{-webkit-mask-image:none;mask-image:none;overflow-x:auto;padding-inline:20px}
.track{display:flex;width:max-content;animation:marq 32s linear infinite}
.editing .track{animation:none}
.logos-band:hover .track{animation-play-state:paused}
.track ul{display:flex;list-style:none;margin:0;padding:0;gap:clamp(44px,7vw,92px);padding-right:clamp(44px,7vw,92px);align-items:center}
.track li{display:flex;align-items:center;gap:10px;height:48px;white-space:nowrap;color:#4a4647;font-weight:700;font-size:20px;opacity:.9;filter:grayscale(1);transition:filter .3s,opacity .3s,transform .3s;position:relative}
.track li:hover{filter:none;opacity:1;transform:scale(1.06)}
.track li img{height:44px;width:auto;max-width:140px;object-fit:contain}
.lg-mark{width:42px;height:42px;display:grid;place-items:center;background:#4a4647;color:#fff;font-weight:800;font-size:15px;flex:0 0 auto}
@keyframes marq{to{transform:translateX(-50%)}}

/* spec work */
.tabs{display:flex;padding-left:8px;position:relative;z-index:2;margin-bottom:-1px}
.tab{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:14px 22px;background:var(--cream);border-radius:14px 14px 0 0}
.tray{background:var(--cream);border-radius:0 24px 24px 24px;padding:clamp(14px,2.4vw,26px);position:relative;box-shadow:0 20px 30px -20px rgba(60,40,20,.3)}
.rail{display:flex;gap:clamp(12px,1.6vw,18px);overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.vcard{position:relative;flex:0 0 auto;height:clamp(300px,34vw,400px);border-radius:20px;overflow:hidden;scroll-snap-align:start;background:#cbb89b;box-shadow:0 12px 22px -14px rgba(0,0,0,.45);transition:transform .35s}
.vcard:hover{transform:translateY(-4px)}
.vcard .tag,.rvid .tag,.dvid .tag{position:absolute;top:12px;left:12px;z-index:3;background:#fff;font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:99px;color:var(--ink)}
.vcard .prod{position:absolute;right:14px;bottom:16px;z-index:3;color:#fff;font-weight:700;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.vcard video,.rvid video,.dvid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:4}
.playing .play,.playing .prod,.playing .tag{display:none}
.nav-arrow{position:absolute;right:10px;top:50%;translate:0 -50%;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2);z-index:6;transition:transform .25s}
.nav-arrow:hover{transform:scale(1.1)}
.nav-arrow svg{width:16px;height:16px}
.tray-foot{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:18px;padding-top:16px}
.tray-foot p{font-weight:700;font-size:14px}
.copy{display:flex;align-items:center;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 5px 5px 18px;gap:10px;max-width:100%}
.copy input{border:0;background:none;font:400 13px var(--mono);color:var(--ink);width:min(220px,48vw);min-width:0;outline:0}
.copy button{background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:11px 18px;border-radius:99px;min-height:40px;transition:background .25s}
.copy button:hover{background:#3a3840}
.copy button.done{background:#2f7d4f}


/* projects */
.pills{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:clamp(20px,3vw,34px)}
.cpill{font-weight:700;font-size:14px;padding:11px 22px;border-radius:99px;background:var(--tan);border:1px solid var(--line);transition:background .25s,color .25s,transform .25s;min-height:44px;display:inline-flex;align-items:center;cursor:pointer;user-select:none}
.cpill:hover{transform:translateY(-2px)}
.cpill[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.report{background:#fff;border-radius:22px;box-shadow:0 22px 40px -22px rgba(60,40,20,.4);padding:clamp(16px,2.6vw,28px);display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:clamp(18px,3vw,34px);position:relative;transition:opacity .3s,transform .4s}
.report.swap{opacity:0;transform:translateY(10px)}
.rcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.rvid,.dvid{position:relative;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#cbb89b;max-width:100%}
.rvid .ph,.dvid .ph{background:linear-gradient(180deg,#fbf3e6 0%,#f7ebe9 35%,#8c7f84 80%,#5e5258 100%)}
.rvid .ph::after,.dvid .ph::after{display:none}
.rvid .ph span,.dvid .ph span{color:#6e6468;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;text-shadow:none}
.readmore{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;border-radius:99px;padding:13px 18px;min-height:48px;transition:transform .25s,background .25s}
.readmore:hover{transform:translateY(-2px);background:#3a3840}
.readmore svg{width:15px;height:15px;transition:transform .25s}
.readmore:hover svg{transform:translateX(3px)}
.rbody{display:flex;flex-direction:column;justify-content:center;min-width:0}
.rbody .eyebrow{color:var(--muted);padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.rbody .brand{color:var(--muted);margin-bottom:2px}
.rbody h3{font-weight:800;font-size:clamp(22px,3vw,30px);letter-spacing:-.03em;margin-bottom:12px;overflow-wrap:anywhere}
.rows{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;font-size:14px;margin:0 0 18px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.rows dt{font-weight:800}
.rows dd{margin:0;color:var(--muted);min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.stat{padding:0 clamp(8px,2vw,22px);border-left:1px solid var(--line);min-width:0}
.stat:first-child{border:0;padding-left:0}
.stat b{display:block;font-weight:900;font-size:clamp(26px,4.4vw,48px);letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat span.mono{color:var(--muted);display:block}
@media (max-width:640px){.report{grid-template-columns:1fr}.rcol{max-width:260px;margin:0 auto;width:100%}.rows{grid-template-columns:1fr;gap:2px}.rows dd{margin-bottom:8px}}

/* project detail page */
.d-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:50}
.d-bar .btn{background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line)}
.d-hero{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(22px,4vw,52px);align-items:start}
.d-intro{display:flex;flex-direction:column;gap:14px;min-width:0}
.d-intro .mono{color:var(--muted)}
.d-intro h1{font-weight:900;font-size:clamp(34px,6vw,68px);letter-spacing:-.045em;line-height:.98;text-wrap:balance;overflow-wrap:anywhere}
.d-sum{font-size:clamp(16px,1.8vw,20px);color:var(--muted);max-width:34em}
.d-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin:8px 0 0;padding-top:18px;border-top:1px solid var(--line)}
.d-meta div{min-width:0}
.d-meta dt{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.d-meta dd{margin:0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.d-stats{background:var(--cream);border-radius:22px;padding:clamp(18px,3vw,32px);margin-top:clamp(24px,4vw,44px)}
.d-stats .stat b{font-size:clamp(32px,6vw,72px)}
.d-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2vw,22px);margin-top:clamp(18px,3vw,30px)}
.d-card{background:#fff;border-radius:20px;padding:clamp(18px,2.4vw,26px);box-shadow:0 14px 26px -18px rgba(60,40,20,.4);min-width:0}
.d-card h3{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.d-card p{font-weight:500;font-size:16px}
.d-story{max-width:46em;margin:clamp(28px,4vw,52px) auto 0}
.d-story h2{font-weight:800;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.035em;margin-bottom:14px}
.d-story p{font-size:17px;line-height:1.65;color:#3d3a3c}
.d-quote{max-width:46em;margin:clamp(24px,4vw,44px) auto 0;background:#FDE9F4;border-radius:22px;padding:clamp(20px,3vw,32px);position:relative}
.d-quote p{font-weight:700;font-size:clamp(17px,2.2vw,22px);line-height:1.35;letter-spacing:-.01em}
.d-quote span{display:block;margin-top:12px;font-size:13px;color:var(--muted)}
.d-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-top:clamp(28px,4vw,52px);padding-top:22px;border-top:1px solid var(--line)}
@media (max-width:760px){.d-hero{grid-template-columns:1fr}.dvid{max-width:260px;margin:0 auto;width:100%}.d-grid{grid-template-columns:1fr}.d-meta{grid-template-columns:1fr 1fr}}

/* photos */
.mosaic{background:var(--ink);border-radius:26px;padding:clamp(10px,1.4vw,16px);position:relative;display:flex;flex-direction:column;gap:12px}
.mrow{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;align-items:flex-start;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.mrow::-webkit-scrollbar{display:none}
.mrow:nth-child(2){padding-left:clamp(20px,5vw,60px)}
.tile{flex:0 0 auto;position:relative;height:clamp(150px,19vw,230px);aspect-ratio:var(--ar,.75);border-radius:14px;overflow:hidden;scroll-snap-align:start;transition:transform .35s,filter .35s;cursor:pointer;background:#555}
.tile:hover,.tile:focus-visible{transform:scale(1.03);filter:saturate(1.15)}
.tile img{transition:transform .6s}
.tile:hover img{transform:scale(1.06)}
.mrow:first-child .tile:nth-child(3n+1){height:clamp(160px,20.5vw,250px)}
.lb{position:fixed;inset:0;z-index:100;background:rgba(18,16,20,.92);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.lb.open{opacity:1;visibility:visible}
.lb-stage{position:relative;width:min(92vw,720px);height:min(78vh,860px);display:grid;place-items:center;transform:scale(.94);transition:transform .35s}
.lb.open .lb-stage{transform:none}
.lb-img{position:relative;height:100%;aspect-ratio:var(--ar,.75);max-width:100%;max-height:100%;border-radius:16px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.lb button{width:48px;height:48px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;z-index:3;transition:transform .2s;position:fixed}
.lb button:hover{transform:scale(1.1)}
.lb button svg{width:18px;height:18px}
.lb .x{top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.lb .prev{left:max(8px,env(safe-area-inset-left,0px));top:50%;translate:0 -50%}
.lb .next{right:max(8px,env(safe-area-inset-right,0px));top:50%;translate:0 -50%}
.lb-count{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:0;right:0;text-align:center;color:#fff;font:500 11px var(--mono);letter-spacing:.1em}

/* testimonials */
.tk{display:flex;gap:clamp(14px,2vw,22px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;padding:22px 4px 14px;-webkit-overflow-scrolling:touch}
.tk::-webkit-scrollbar{display:none}
.tcard{flex:0 0 calc((100% - 2*clamp(14px,2vw,22px))/3);scroll-snap-align:start;border-radius:22px;padding:clamp(22px,2.4vw,30px) clamp(18px,2vw,26px) 20px;position:relative;box-shadow:0 14px 24px -16px rgba(60,40,20,.4);transition:transform .35s;min-width:0}
.tcard:nth-child(odd){background:#FDE9F4;--cardbg:#FDE9F4}
.tcard:nth-child(even){background:#FAF0E0;--cardbg:#FAF0E0}
.tcard:hover{transform:translateY(-4px)}
.tape{position:absolute;top:-16px;left:50%;width:30%;min-width:80px;height:34px;translate:-50% 0;background:rgba(238,230,220,.85);box-shadow:0 2px 6px rgba(0,0,0,.12);z-index:5}

.tq.clamped::after{content:"";position:absolute;left:0;right:0;bottom:0;height:1.5em;background:linear-gradient(transparent,var(--cardbg,#FAF0E0));pointer-events:none}
.rm{font-weight:700;font-size:13px;margin-top:10px;border-bottom:2px solid var(--pink);padding:4px 0 2px;min-height:32px}
.who{display:flex;align-items:center;gap:12px;margin-top:22px}
.av{width:42px;height:42px;border-radius:50%;border:1.5px dashed #c9bda5;background:#EFEAD9;overflow:hidden;flex:0 0 auto;display:grid;place-items:center;font-weight:800;font-size:15px;color:#8a7f6a;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.who b{display:block;font-size:13px;font-weight:700;line-height:1.2}

.tk-ctrl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:6px}
.dots{display:flex;gap:7px}
.dots button{width:8px;height:8px;border-radius:99px;background:#d8d2c8;transition:width .3s,background .3s;padding:0}

.tnav{position:absolute;right:6px;top:46%;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.18);z-index:5}
.tnav svg{width:15px;height:15px}
@media (max-width:900px){.tcard{flex-basis:calc((100% - 16px)/2)}}
@media (max-width:600px){.tcard{flex-basis:86%}}

/* education & work experience */
.jgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(16px,3vw,32px)}
.jcol{background:var(--cream);border-radius:24px;padding:clamp(20px,3vw,34px);min-width:0}
.jcol>h3{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:22px}
.jcol>h3 i{width:10px;height:10px;border-radius:50%;background:var(--pink);display:block}
.tl{list-style:none;margin:0;padding:0 0 0 22px;position:relative;display:flex;flex-direction:column;gap:24px}
.tl::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{position:relative;min-width:0}
.tl li::before{content:"";position:absolute;left:-22px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--pink)}
.tl .per{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.tl .ttl{font-weight:800;font-size:18px;letter-spacing:-.02em;line-height:1.2;display:block;overflow-wrap:anywhere}
.tl .org{font-weight:600;font-size:14.5px;display:block;margin-top:2px;overflow-wrap:anywhere}
.tl .note{font-size:14px;color:var(--muted);display:block;margin-top:6px;overflow-wrap:anywhere}
@media (max-width:760px){.jgrid{grid-template-columns:1fr}}

/* about (nice to meet you) */
.about{padding-block:clamp(36px,6vw,80px)}
.about-in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center;position:relative}
.about-bg{position:absolute;inset:8% -2% 4% 8%;background:var(--cream);border-radius:20px}
.photo-wrap{position:relative;z-index:2;width:min(340px,86%);margin-left:clamp(0px,3vw,40px)}
.about-photo{position:relative;aspect-ratio:.82;border-radius:46% 46% 40px 40px/22% 22% 40px 40px;overflow:hidden;box-shadow:0 26px 40px -22px rgba(0,0,0,.5);background:#cbd0d0}
.handle{position:absolute;left:-14px;bottom:26px;z-index:5;background:var(--pink);color:#7a1c47;font-weight:600;font-size:12px;padding:10px 16px;border-radius:99px;display:flex;gap:7px;align-items:center;text-decoration:none;transition:transform .25s;max-width:90%}
.handle:hover{transform:scale(1.06)}
.handle svg{width:14px;height:14px;flex:0 0 auto}
.chip-ok{position:absolute;top:12%;right:-18px;z-index:5;background:#fff;font-weight:700;font-size:12px;padding:8px 14px;border-radius:99px;box-shadow:0 6px 14px rgba(0,0,0,.14)}
.about-text{position:relative;z-index:2;display:flex;flex-direction:column;gap:16px;align-items:flex-start;padding:clamp(10px,2vw,30px) clamp(0px,2vw,30px) clamp(10px,2vw,30px) clamp(0px,3vw,30px);min-width:0}
.about-text h2{font-weight:800;font-size:clamp(28px,4vw,40px);letter-spacing:-.035em;line-height:1.05}
.about-text .lead{font-weight:700;font-size:clamp(17px,2vw,21px);line-height:1.3;max-width:24em;letter-spacing:-.01em}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.fact{background:#fff;font-weight:600;font-size:13px;padding:10px 16px;border-radius:99px;box-shadow:0 4px 10px -6px rgba(60,40,20,.3);transition:transform .25s;display:inline-flex;align-items:center;gap:8px}
.fact:hover{transform:translateY(-3px)}
@media (max-width:760px){.about-in{grid-template-columns:1fr;gap:30px}.about-bg{inset:30% -2% 0 -2%}.photo-wrap{margin:0 auto}.about-text{padding:0 6px 16px}}

/* footer */
.footer{background:var(--ink);color:#fff;border-radius:var(--r-frame) var(--r-frame) 0 0;margin-top:clamp(24px,5vw,56px);padding:clamp(28px,4vw,56px) clamp(22px,4vw,56px) 0;overflow:hidden;display:flex;flex-direction:column}
.f-top{display:grid;grid-template-columns:auto auto 1fr;gap:clamp(24px,6vw,80px)}
.f-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.f-col h4{margin:0 0 6px;font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#aaa6b0}
.f-col a{font-size:13px;text-decoration:none;color:#fff;display:inline-flex;align-items:center;gap:9px;transition:color .2s,transform .2s;width:fit-content;max-width:100%;overflow-wrap:anywhere}
.f-col .em{font-family:var(--mono);font-size:12.5px}
.f-col a:hover{color:var(--pink);transform:translateX(3px)}
.f-col svg{width:14px;height:14px;flex:0 0 auto}
.f-cta{display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.fbtn{display:flex;justify-content:space-between;align-items:center;gap:22px;padding:7px 7px 7px 20px;border-radius:99px;font-weight:700;font-size:13px;text-decoration:none;color:var(--ink);min-width:200px;transition:transform .25s}
.fbtn:hover{transform:translateY(-2px)}
.fbtn i{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;transition:transform .25s}
.fbtn:hover i{transform:translateX(3px)}
.fbtn.a{background:var(--tan)}.fbtn.b{background:var(--pink)}
.legal{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;font-size:11px;color:#9a96a0}
.legal a{color:#9a96a0;text-underline-offset:3px}.legal a:hover{color:#fff}
.bigname{font-weight:900;font-size:clamp(56px,13.6vw,170px);letter-spacing:-.055em;line-height:.8;color:var(--pink-soft);white-space:nowrap;margin-top:clamp(40px,8vw,90px);margin-bottom:-.07em;overflow:hidden}
@media (max-width:760px){.f-top{grid-template-columns:1fr 1fr}.f-cta{grid-column:1/-1;align-items:stretch}.legal{justify-content:flex-start}}
@media (max-width:420px){.f-top{grid-template-columns:1fr}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .stage{height:min(480px,110vw);order:-1;margin-bottom:6px}
  .hero h1{font-size:clamp(64px,19vw,120px)}
}

/* motion */
.rv{transform:translateY(26px);transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{transform:none}
.hero-in h1 span,.hero-in .bio,.hero-in .cta{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero-in h1 span:nth-child(2){animation-delay:.1s}.hero-in .bio{animation-delay:.2s}.hero-in .cta{animation-delay:.3s}
.hero-in .phone{animation:pop 1s cubic-bezier(.2,.7,.2,1) .15s both}
@keyframes rise{from{transform:translateY(34px);opacity:.01}to{transform:none;opacity:1}}
@keyframes pop{from{transform:translateY(40px) scale(.96);opacity:.01}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);translate:-50% 20px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:12px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .3s,translate .3s;z-index:200;max-width:90vw;text-align:center}
.toast.on{opacity:1;translate:-50% 0}

/* edit mode */
.ebar{position:fixed;left:50%;translate:-50% 0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:150;background:var(--ink);color:#fff;border-radius:99px;padding:7px 8px 7px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 14px 30px rgba(0,0,0,.35);max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}
.ebar b{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin-right:4px}
.ebar button{background:#fff;color:var(--ink);font-weight:700;font-size:12.5px;padding:9px 14px;border-radius:99px;min-height:38px}
.ebar button.pk{background:var(--pink)}
body.editing{padding-bottom:90px}
[contenteditable="true"]{outline:1.5px dashed rgba(214,36,110,.45);outline-offset:3px;border-radius:4px;cursor:text;min-width:1ch}
[contenteditable="true"]:hover{background:rgba(255,184,217,.25)}
[contenteditable="true"]:focus{outline:2px solid #d6246e;background:rgba(255,184,217,.3)}
[contenteditable="true"]:empty::before{content:"Type here";opacity:.45}
.addbtn,.delbtn,.mgear{font:600 12px var(--display);border-radius:99px;min-height:34px;padding:7px 14px}
.addbtn{background:#fff;border:1.5px dashed #d6246e;color:#a3144f}
.addbtn:hover{background:var(--pink-soft)}
.delbtn{background:#fff;color:#a3144f;border:1px solid #f0b6cf;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.delbtn.armed{background:#d6246e;color:#fff;border-color:#d6246e}
.mgear{position:absolute;top:8px;right:8px;z-index:8;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.25);padding:6px 11px;min-height:30px;font-size:11px}
.xdel{position:absolute;top:6px;right:6px;z-index:9}
.addtile{flex:0 0 auto;height:clamp(150px,19vw,230px);aspect-ratio:.75;border-radius:14px;border:2px dashed #d6246e;color:#ffb8d9;display:grid;place-items:center;font-weight:700;font-size:14px;text-align:center}
.vadd{height:clamp(300px,34vw,400px);aspect-ratio:9/16;background:transparent;color:#a3144f}
.pop{position:fixed;inset:0;z-index:300;background:rgba(18,16,20,.55);display:grid;place-items:center;padding:16px}
.pop[hidden]{display:none}
.pop-card{background:#fff;border-radius:22px;padding:22px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px rgba(0,0,0,.4);max-height:90vh;overflow:auto}
.pop-card h3{font-weight:800;font-size:20px;letter-spacing:-.02em}
.pop-card label{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.pop-card input{font:400 14px var(--display);padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;width:100%;text-transform:none;letter-spacing:0;color:var(--ink);background:#fff}
.pop-card .row{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.pop-card p{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .track{animation:none}
}

/* =====================================================================
   MOBILE POLISH (added): tap behaviour, wide videos, landscape phones,
   lighter effects, bigger edit-mode controls
   ===================================================================== */
html{-webkit-tap-highlight-color:transparent}
a,button,[role=button],[role=tab],.tile,.vcard,.cpill,.phone{touch-action:manipulation}
.rail{overscroll-behavior-x:contain}
.mrow,.tk,.navin{overscroll-behavior-x:contain}
@media (max-width:640px){
  /* horizontal (16:9) videos shrink to the screen instead of running off it */
  .rail{align-items:flex-start;scroll-padding-left:12px}
  .vcard.wide{height:auto;width:calc(100vw - 80px);max-width:420px}
  /* lighter blur on placeholders: smoother on older phones */
  .ph::after{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  /* section tabs: a little more breathing room under the sticky bar */
  section[id],footer[id]{scroll-margin-top:72px}
  /* testimonial text stays readable */
  .rm{min-height:44px;display:inline-flex;align-items:center}
}
/* phones held sideways */
@media (max-height:520px) and (orientation:landscape){
  .stage{height:min(78vh,360px)}
  .hero{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}
  .hero h1{font-size:clamp(44px,9vw,80px)}
  .lb-stage{height:calc(100svh - 40px)}
  .lb .prev,.lb .next{top:50%;bottom:auto;translate:0 -50%}
  .lb .prev{left:max(8px,env(safe-area-inset-left,0px))}
  .lb .next{right:max(8px,env(safe-area-inset-right,0px))}
}
/* finger-sized controls for edit mode on touch screens */
@media (pointer:coarse){
  .mgear,.addbtn,.delbtn{min-height:40px}
  .mgear{padding:8px 13px}
  .ebar button{min-height:42px}
}

   DYNAMIC MOBILE SECTIONS (added)
   ===================================================================== */
.seg,.mbar{display:none}

  /* hero: name and buttons first, video below */
  .stage{order:0;margin-top:4px}

  if (t.closest("#vnext")) { const r = $("#vrail"), end = r.scrollLeft + r.clientWidth >= r.scrollWidth - 4; r.scrollTo({ left: end ? 0 : r.scrollLeft + r.clientWidth * .75, behavior: "smooth" }); return; }
  if (t.closest("#mnext")) { const r1 = $("#mr1"), r2 = $("#mr2"), end = r1.scrollLeft + r1.clientWidth >= r1.scrollWidth - 4, to = end ? 0 : r1.scrollLeft + r1.clientWidth * .7; r1.scrollTo({ left: to, behavior: "smooth" }); r2.scrollTo({ left: to * .92, behavior: "smooth" }); return; }
  if (t.closest(".phone")) { if (t.closest("[contenteditable]")) return; playInto($("#hv"), SITE.hero.video); return; }
  const vc = t.closest(".vcard");
  if (vc && !t.closest("video") && !t.closest("[contenteditable]")) { playInto(vc, SITE.work.videos[+vc.dataset.vi]); return; }
  const rv = t.closest(".rvid");
  if (rv && !t.closest("video") && !t.closest("[contenteditable]")) { playInto(rv, SITE.results.items[selP].video); return; }
  const dv = t.closest(".dvid");
  if (dv && !t.closest("video") && !t.closest("[contenteditable]")) { playInto(dv, SITE.results.items[curP].video); return; }
  if (t.closest("#copyr")) { footTaps = (footTaps || 0) + 1; clearTimeout(footT); footT = setTimeout(() => footTaps = 0, 2500); if (footTaps >= 5) { footTaps = 0; try { localStorage.setItem(EKEY, "1"); } catch (_) {} location.reload(); } }
});
let footTaps = 0, footT;
function selectProject(i) {
  if (i === selP) return; selP = i;
  document.querySelectorAll(".cpill").forEach((p, k) => { p.setAttribute("aria-selected", k === i); if (k === i && p.parentElement.scrollWidth > p.parentElement.clientWidth) p.parentElement.scrollTo({ left: p.offsetLeft - (p.parentElement.clientWidth - p.offsetWidth) / 2, behavior: "smooth" }); });
  const rep = $("#report"); rep.classList.add("swap");
  setTimeout(() => { fillReport(); rep.classList.remove("swap"); }, 230);
}
document.addEventListener("keydown", e => {
  if (lb.classList.contains("open")) { if (e.key === "Escape") lbClose(); if (e.key === "ArrowLeft") lbShow(lbCur - 1); if (e.key === "ArrowRight") lbShow(lbCur + 1); return; }
  if (e.key === "Escape") { if (!$("#pop").hidden) $("#pop").hidden = true; else if (!$("#detail").hidden) leaveProject(); return; }
  if (EDIT && e.key === "Enter" && e.target.matches && e.target.matches("[contenteditable]") && !e.target.classList.contains("pre")) { e.preventDefault(); e.target.blur(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-pi],[data-ti]")) { e.preventDefault(); e.target.click(); }
});
document.addEventListener("input", e => {
  const el = e.target.closest && e.target.closest("[data-p]"); if (!el || !EDIT) return;
  const v = el.tagName === "INPUT" ? el.value : el.innerText.replace(/ /g, " ").replace(/\n{3,}/g, "\n\n").replace(/\n$/, "");
  setP(el.dataset.p, v); save();
  if (el.dataset.p === "email") document.querySelectorAll("#em1,#em2").forEach(i => { if (i !== el) i.value = v; });
});
document.addEventListener("paste", e => {
  if (!EDIT || !e.target.closest || !e.target.closest("[contenteditable]")) return;
  e.preventDefault(); const t = (e.clipboardData || window.clipboardData).getData("text/plain"); document.execCommand("insertText", false, t);
});
$("#pop").addEventListener("click", e => { if (e.target.id === "pop") $("#pop").hidden = true; });
$("#pop").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("input")) $("[data-act=popok]").click(); });
document.addEventListener("scroll", e => {
  if (!e.target.classList || !e.target.classList.contains("tk")) return;
  const i = Math.round(e.target.scrollLeft / tStep());
  document.querySelectorAll("#dots button").forEach((d, k) => k === i ? d.setAttribute("aria-current", "true") : d.removeAttribute("aria-current"));
}, true);


/* ============================ dynamic mobile sections ============================ */
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-jt]"); if (!b) return;
  const g = $("#jgrid"); if (!g) return;
  g.dataset.show = b.dataset.jt;
  document.querySelectorAll("[data-jt]").forEach(x => x.setAttribute("aria-selected", String(x === b)));
});
(function () {
  let x0 = 0, y0 = 0;
  document.addEventListener("touchstart", e => { if (e.target.closest && e.target.closest("#report")) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } }, { passive: true });
  document.addEventListener("touchend", e => {
    if (EDIT || !e.target.closest || !e.target.closest("#report") || e.target.closest("video")) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0, n = SITE.results.items.length;
    if (Math.abs(dx) < 70 || Math.abs(dy) > 45 || n < 2) return;
    selectProject((selP + (dx < 0 ? 1 : -1) + n) % n);
  }, { passive: true });
})();
(function () {
  const site = $("#site"); if (!site) return;
  site.insertAdjacentHTML("beforeend", `<div class="mbar" id="mbar"><a href="#projects" data-go="projects">${I.folder} Projects</a><a href="mailto:${esc(SITE.email)}" data-email>${I.mail} Email me</a></div>`);
  const bar = $("#mbar"); let pastHero = false, atFoot = false;
  const upd = () => bar.classList.toggle("show", pastHero && !atFoot);
  const io = new IntersectionObserver(en => en.forEach(x => { if (x.target.id === "hero") pastHero = !x.isIntersecting && x.boundingClientRect.top < 0; else atFoot = x.isIntersecting; upd(); }), { threshold: 0 });
  io.observe($("#hero")); io.observe($("#contact"));
})();

/* ============================ init ============================ */
renderAll();
if (EDIT) {
  document.body.classList.add("editing");
  document.body.insertAdjacentHTML("beforeend", `<div class="ebar" role="toolbar" aria-label="Edit mode"><b>Editing</b><button data-act="links">Name &amp; links</button><button class="pk" data-act="copyall">Copy content</button><button data-act="reset">Reset</button><button data-act="exit">Exit</button></div>`);
  toast("Edit mode on. Click any text to change it.");
}
(function () {
  const els = document.querySelectorAll(".rv");
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(en => en.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .05, rootMargin: "0px 0px -4% 0px" });
  els.forEach(e => io.observe(e));
})();
</script>

</body></html>
